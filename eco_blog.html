<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exo - Eco Blog</title>
    <!-- Page's icon -->
    <link rel="icon" href="img/exo.png">
    <!-- Stylesheet -->
    <link rel="stylesheet" href="css/style_blog.css">
     <!-- Manifest -->
    <link rel="manifest" href="manifest.json">
    <!-- Service Worker -->
    <script>
        if ('serviceWorker' in navigator) {
          window.addEventListener('load', () => {
            navigator.serviceWorker.register('/service-worker.js')
              .then(registration => {
                console.log('Service Worker registrado con éxito:', registration);
              })
              .catch(error => {
                console.error('Error al registrar el Service Worker:', error);
              });
          });
        }
    </script>
    <!-- Font Source -->
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Audiowide&display=swap');
    </style>
</head>
<body class="page">

  <!-- ?? MENU -->

  <div class="menu" id="div">
    
    <div class="toggle round-button red" title="More"><ion-icon name="add-outline" class="rotate"></ion-icon></div>
      
      <!-- web stamps -->
      <a href="web_stamps.html">
      <li style="--i:0;" title="stamps" class="round-button orange"><ion-icon name="sparkles-outline"></ion-icon></li>
      </a>
      <!-- pairs game -->
      <a href="pairs_game.html">
      <li style="--i:1;" title="pairs"  class="round-button blue"><ion-icon name="game-controller-outline"></ion-icon></li>
      </a>
      <!-- home -->
      <a href="index.html">
      <li style="--i:2;" title="home"  class="round-button green"><ion-icon name="earth-outline"></ion-icon></li>
      </a>
      <!-- music player -->
      <a href="music_player.html">
      <li style="--i:3;" title="music" class="round-button purple"><ion-icon name="musical-notes-outline"></ion-icon></li>
      </a>
      <!-- themed calendar -->
      <a href="themed_calendar.html">
      <li style="--i:4;" title="calendar" class="round-button yellow"><ion-icon name="calendar-outline"></ion-icon></li>
      </a>

  </div>

  <!-- ?? /MENU -->

  <!-- ?? BLOG -->

  <div class="container">
    <div class="content glass">
      <div>
        <div class="board">

          <div class="buttons">
            <button class="Btn color_one active" onclick="changePage('blogs/bioplastic.html', this)">
              Bioplastic
            </button>
            <button class="Btn color_two" onclick="changePage('blogs/gardening.html', this)">
              Gardening
            </button>
          </div>

          <div class="trapezoid-clip"></div>

          <div class="iframe-container">
              <iframe title="iframe" id="embeddedPage" src="blogs/bioplastic.html"></iframe>
          </div>

        </div>
      </div>
    </div>
  </div>

  <!-- ?? /BLOG -->

  <!-- !! EMBED-SCRIPT -->

   <script>
      // Page Navigation
      function changePage(url, button) {
          // Remove active class from all buttons
          document.querySelectorAll('.Btn').forEach(btn => {
              btn.classList.remove('active');
          });
          
          // Add active class to clicked button
          button.classList.add('active');
          
          // Change iframe source
          document.getElementById('embeddedPage').src = url;
      }
    </script>

  <!-- !! EMBED-SCRIPT -->

  <!-- !! MENU-SCRIPT -->

    <script type="module" src="https://unpkg.com/ionicons@5.5.2/dist/ionicons/ionicons.esm.js"></script>
    <script nomodule src="https://unpkg.com/ionicons@5.5.2/dist/ionicons/ionicons.js"></script>

    <script>
    let isDragging = false;
    let dragStartPos = { x: 0, y: 0 };
    let dragStartTime = 0;
    let dragThreshold = 8; // pixels to considerate drag
    let clickTimeThreshold = 300; // ms max to click
    let initialElementPos = { x: 0, y: 0 };

    let toggle = document.querySelector('.toggle');
    let menu = document.querySelector('.menu');

    toggle.onmousedown = function(e) {
      e.preventDefault();
      e.stopPropagation(); // Important: avoid propagation
  
    // Save initial data
    dragStartPos.x = e.pageX;
    dragStartPos.y = e.pageY;
    dragStartTime = Date.now();
    isDragging = false;
  
    // Prepare to possible entire menu's drag
    menu.style.position = "absolute";
    initialElementPos.x = parseInt(menu.style.left) || 0;
    initialElementPos.y = parseInt(menu.style.top) || 0;
    };

    document.onmouseup = function(e) {
      if (dragStartTime > 0) {
        const clickDuration = Date.now() - dragStartTime;
        
        if (isDragging) {
          // DRAG = active - no toggle
          console.log("Menu arrastrado");
        } else if (clickDuration < clickTimeThreshold) {
          // CLICK = active - do toggle
          menu.classList.toggle('active');
        }
        
        // Reset variables
        isDragging = false;
        dragStartTime = 0;
      }
      
      drag = null;
    }

      document.onmousemove = function(e) {
        // Detect drag from toggle
        if (dragStartTime > 0) {
          const deltaX = e.pageX - dragStartPos.x;
          const deltaY = e.pageY - dragStartPos.y;
          const distance = Math.sqrt(deltaX * deltaX + deltaY * deltaY);
          
          // Detect if is drag
          if (distance > dragThreshold && !isDragging) {
            isDragging = true;
            drag = menu; // Asign entire menu to drag
          }
        }
          
      if (drag) {
        var x = e.pageX;
        var y = e.pageY;
        
        drag.style.left = x - 100 + "px";
        drag.style.top = y - 100 + "px";
      }
    }
    </script>

    <!-- !! /MENU-SCRIPT -->
    
</body>
</html>
