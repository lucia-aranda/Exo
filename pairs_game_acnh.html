    <div class="container">
        <h1>Animal Crossing Pairs</h1>
        
        <div class="win-message" id="winMessage">
            ¡YOU WON!
        </div>

        <div class="stats">
            <div class="stat">
                <div class="stat-label">Moves</div>
                <div class="stat-value" id="moves">0</div>
            </div>
            <div class="stat">
                <div class="stat-label">Pairs</div>
                <div class="stat-value" id="pairs">0/8</div>
            </div>
            <div class="stat">
                <div class="stat-label">Time</div>
                <div class="stat-value" id="timer">0:00</div>
            </div>
        </div>

        <div class="game-board" id="gameBoard"></div>

        <div class="controls">
            <button onclick="resetGame()">Reset Game</button>
        </div>
    </div>

    <script>
        // Images should ideally be square and around 200x200px for best results
        const imageUrls = [
            'img/acnh_acorn.png', 
            'img/acnh_bells.png', 
            'img/acnh_book.png', 
            'img/acnh_branch.webp', 
            'img/acnh_coin.png', 
            'img/acnh_cupcake.png', 
            'img/acnh_eggfish.png', 
            'img/acnh_fishbait.png', 
            'img/acnh_heartcrystals.webp', 
            'img/acnh_leaf.png', 
            'img/acnh_wand.png', 
            'img/acnh_starfragment.png', 
            'img/acnh_pinecone.png', 
            'img/acnh_snowflake.png'
        ];
        
        let cards = [];
        let flippedCards = [];
        let matchedPairs = 0;
        let moves = 0;
        let gameStarted = false;
        let timer = 0;
        let timerInterval;

        function initGame() {
            const gameBoard = document.getElementById('gameBoard');
            gameBoard.innerHTML = '';
            
            cards = [...imageUrls, ...imageUrls]
                .sort(() => Math.random() - 0.5)
                .map((imgUrl, index) => ({
                    id: index,
                    imageUrl: imgUrl,
                    flipped: false,
                    matched: false
                }));

            cards.forEach((card, index) => {
                const cardElement = document.createElement('div');
                cardElement.className = 'card';
                cardElement.dataset.index = index;
                cardElement.innerHTML = `
                    <div class="card-front"><img class="card-size" src="img/acnh_question.png"></img></div>
                    <div class="card-back">
                        <img src="${card.imageUrl}" alt="Card ${index}">
                    </div>
                `;
                cardElement.addEventListener('click', () => flipCard(index));
                gameBoard.appendChild(cardElement);
            });

            flippedCards = [];
            matchedPairs = 0;
            moves = 0;
            gameStarted = false;
            timer = 0;
            
            updateStats();
            document.getElementById('winMessage').classList.remove('show');
            
            if (timerInterval) {
                clearInterval(timerInterval);
            }
        }

        function flipCard(index) {
            if (!gameStarted) {
                startTimer();
                gameStarted = true;
            }

            const card = cards[index];
            const cardElement = document.querySelector(`[data-index="${index}"]`);

            if (card.matched || card.flipped || flippedCards.length === 2) {
                return;
            }

            card.flipped = true;
            cardElement.classList.add('flipped');
            flippedCards.push({ card, element: cardElement, index });

            if (flippedCards.length === 2) {
                moves++;
                updateStats();
                checkMatch();
            }
        }

        function checkMatch() {
            const [first, second] = flippedCards;

            if (first.card.imageUrl === second.card.imageUrl) {
                setTimeout(() => {
                    first.card.matched = true;
                    second.card.matched = true;
                    first.element.classList.add('matched');
                    second.element.classList.add('matched');
                    matchedPairs++;
                    updateStats();
                    flippedCards = [];

                    if (matchedPairs === imageUrls.length) {
                        endGame();
                    }
                }, 500);
            } else {
                setTimeout(() => {
                    first.card.flipped = false;
                    second.card.flipped = false;
                    first.element.classList.remove('flipped');
                    second.element.classList.remove('flipped');
                    flippedCards = [];
                }, 1000);
            }
        }

        function startTimer() {
            timerInterval = setInterval(() => {
                timer++;
                updateTimer();
            }, 1000);
        }

        function updateTimer() {
            const minutes = Math.floor(timer / 60);
            const seconds = timer % 60;
            document.getElementById('timer').textContent = 
                `${minutes}:${seconds.toString().padStart(2, '0')}`;
        }

        function updateStats() {
            document.getElementById('moves').textContent = moves;
            document.getElementById('pairs').textContent = `${matchedPairs}/${imageUrls.length}`;
        }

        function endGame() {
            clearInterval(timerInterval);
            setTimeout(() => {
                document.getElementById('winMessage').classList.add('show');
            }, 500);
        }

        function resetGame() {
            if (timerInterval) {
                clearInterval(timerInterval);
            }
            initGame();
        }

        initGame();
    </script>

    <!-- !! MENU-SCRIPT -->

    <script type="module" src="https://unpkg.com/ionicons@5.5.2/dist/ionicons/ionicons.esm.js"></script>
    <script nomodule src="https://unpkg.com/ionicons@5.5.2/dist/ionicons/ionicons.js"></script>

    <script>
    let isDragging = false;
    let dragStartPos = { x: 0, y: 0 };
    let dragStartTime = 0;
    let dragThreshold = 8; // pixels to considerate drag
    let clickTimeThreshold = 300; // ms max to click
    let initialElementPos = { x: 0, y: 0 };

    let toggle = document.querySelector('.toggle');
    let menu = document.querySelector('.menu');

    toggle.onmousedown = function(e) {
      e.preventDefault();
      e.stopPropagation(); // Important: avoid propagation
  
    // Save initial data
    dragStartPos.x = e.pageX;
    dragStartPos.y = e.pageY;
    dragStartTime = Date.now();
    isDragging = false;
  
    // Prepare to possible entire menu's drag
    menu.style.position = "absolute";
    initialElementPos.x = parseInt(menu.style.left) || 0;
    initialElementPos.y = parseInt(menu.style.top) || 0;
    };

    document.onmouseup = function(e) {
      if (dragStartTime > 0) {
        const clickDuration = Date.now() - dragStartTime;
        
        if (isDragging) {
          // DRAG = active - no toggle
          console.log("Menu arrastrado");
        } else if (clickDuration < clickTimeThreshold) {
          // CLICK = active - do toggle
          menu.classList.toggle('active');
        }
        
        // Reset variables
        isDragging = false;
        dragStartTime = 0;
      }
      
      drag = null;
    }

      document.onmousemove = function(e) {
        // Detect drag from toggle
        if (dragStartTime > 0) {
          const deltaX = e.pageX - dragStartPos.x;
          const deltaY = e.pageY - dragStartPos.y;
          const distance = Math.sqrt(deltaX * deltaX + deltaY * deltaY);
          
          // Detect if is drag
          if (distance > dragThreshold && !isDragging) {
            isDragging = true;
            drag = menu; // Asign entire menu to drag
          }
        }
          
      if (drag) {
        var x = e.pageX;
        var y = e.pageY;
        
        drag.style.left = x - 100 + "px";
        drag.style.top = y - 100 + "px";
      }
    }
    </script>

    <!-- !! /MENU-SCRIPT -->
