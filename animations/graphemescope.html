<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Graphemescope in Action by @molefrog</title>
    <style>
        @import url(https://fonts.googleapis.com/css?family=Roboto+Condensed:400,700);
        body {
        /* Makes kaleidoscope fullscreen */
        margin: 0; padding: 0;
        overflow : hidden;
        background-color : black;
        }
        .overlay {
        background-color: black;
        opacity : 0.9;
        padding : 5px;
        position:absolute;
        top: 5px; left: 0px;
        z-index: 2;
        font-family: "Roboto Condensed";
        font-size: 1.5em;
        color: white;
        text-decoration: none;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/2.1.3/jquery.min.js"></script>
    <script src="https://rawgithub.com/Grapheme/graphemescope/master/lib/graphemescope.js"></script>
</head>
<body>

    <div id="container"></div>

    <script>
        var images = [
        "https://images.rawpixel.com/image_png_800/cHJpdmF0ZS9sci9pbWFnZXMvd2Vic2l0ZS8yMDI0LTEwL3Jhd3BpeGVsb2ZmaWNlMTBfcmVhbGlzdGljXzIwMDBzX3V0b3BpYW5fYWVzdGhldGljXzNkX2lsbHVzdHJhdF80YTQzNzk0OS0wYTYyLTRhZjgtYTEzOC1iMmM0OTI3NmU3MzRfMS5wbmc.png",
        "https://hhsvoyager.org/wp-content/uploads/2019/12/colors.jpg",
        "https://wallpaperaccess.com/full/188653.jpg",
        "https://jadebultitude.b-cdn.net/wp-content/uploads/2023/04/example-of-renaissance-sheet-music-copy.jpg"
        ];


        // Let's create graphemescope object inside the container
        var container = $("#container");
        var scope = new Graphemescope( container[0] );


        var index = 0;
        function changePicture() {
            scope.setImage(images[index]);  
            index = (index + 1) % images.length;
        };

        setInterval(changePicture, 2000);
        changePicture();

        $(window).mousemove(function(event) {
        var factorx = event.pageX / $(window).width();
        var factory = event.pageY / $(window).height()
        
        // This will move kaleidoscope
        scope.angleTarget = factorx;
        scope.zoomTarget  = 1.0 + 0.5 * factory;
        });


        var resizeHandler = function() {
        container.height( $(window).height() );
        container.width( $(window).width() );
        };

        $(window).resize(resizeHandler);
        $(window).resize();

        container.click(changePicture);
    </script>
    
</body>
</html>
