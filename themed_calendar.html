    <script>
        let currentDate = new Date();
        let selectedDay = null;
        let selectedIcon = null;
        let dayIcons = {};
        
        const monthNames = [
            'January', 'February', 'March', 'April', 'May', 'June',
            'July', 'August', 'September', 'October', 'November', 'December'
        ];

        function renderCalendar() {
            const year = currentDate.getFullYear();
            const month = currentDate.getMonth();
            
            document.getElementById('monthYear').textContent = `${monthNames[month]} ${year}`;
            
            const firstDay = new Date(year, month, 1);
            const lastDay = new Date(year, month + 1, 0);
            const daysInMonth = lastDay.getDate();
            const startingDay = firstDay.getDay();
            
            const daysContainer = document.getElementById('days');
            daysContainer.innerHTML = '';
            
            // Previous month days
            const prevMonth = new Date(year, month - 1, 0);
            for (let i = startingDay - 1; i >= 0; i--) {
                const dayElement = createDayElement(prevMonth.getDate() - i, true);
                daysContainer.appendChild(dayElement);
            }
            
            // Actual month days
            for (let day = 1; day <= daysInMonth; day++) {
                const dayElement = createDayElement(day, false);
                daysContainer.appendChild(dayElement);
            }
            
            // Next month days
            const totalCells = daysContainer.children.length;
            const remainingCells = 42 - totalCells; // 6 rows x 7 days
            for (let day = 1; day <= remainingCells; day++) {
                const dayElement = createDayElement(day, true);
                daysContainer.appendChild(dayElement);
            }
        }

        function createDayElement(day, isOtherMonth) {
            const dayElement = document.createElement('div');
            dayElement.className = 'day';
            
            if (isOtherMonth) {
                dayElement.classList.add('other-month');
            }
            
            const today = new Date();
            if (!isOtherMonth && 
                day === today.getDate() && 
                currentDate.getMonth() === today.getMonth() && 
                currentDate.getFullYear() === today.getFullYear()) {
                dayElement.classList.add('today');
            }
            
            const dayNumber = document.createElement('div');
            dayNumber.className = 'day-number';
            dayNumber.textContent = day;
            dayElement.appendChild(dayNumber);
            
            const dayIcon = document.createElement('div');
            dayIcon.className = 'day-icon';
            dayElement.appendChild(dayIcon);
            
            if (!isOtherMonth) {
                const dateKey = `${currentDate.getFullYear()}-${currentDate.getMonth()}-${day}`;
                if (dayIcons[dateKey]) {
                    dayIcon.innerHTML = `<img src="${dayIcons[dateKey]}" alt="Icon" style="width: 50px; height: 50px; object-fit: cover; border-radius: 50%;" onerror="this.style.display='none';">`;
                }
                
                dayElement.addEventListener('click', () => selectDay(dayElement, day));
            }
            
            return dayElement;
        }

        function selectDay(dayElement, day) {
            // Remove previous selection
            if (selectedDay) {
                selectedDay.classList.remove('selected');
            }
            
            // Select new day
            selectedDay = dayElement;
            selectedDay.classList.add('selected');
        }

        function selectIcon(iconSrc) {
            if (selectedDay) {
                const dayNumber = selectedDay.querySelector('.day-number').textContent;
                const dateKey = `${currentDate.getFullYear()}-${currentDate.getMonth()}-${dayNumber}`;
                
                const dayIcon = selectedDay.querySelector('.day-icon');
                
                if (iconSrc === '') {
                    // Delete all icons
                    delete dayIcons[dateKey];
                    dayIcon.innerHTML = '';
                } else {
                    // Create array if it doesn't exists
                    if (!dayIcons[dateKey]) {
                        dayIcons[dateKey] = [];
                    }
                    
                    // Add new icon to the array
                    dayIcons[dateKey].push(iconSrc);
                    
                    // Show all icons inside calendar (set and size)
                    const imagesHTML = dayIcons[dateKey].map(src => 
                        `<img src="${src}" alt="Icon" style="width: 40px; height: 40px; object-fit: cover; border-radius: 2px; margin: 1px;">`
                    ).join('');
                    
                    dayIcon.innerHTML = imagesHTML;
                }
            }
        }

        function changeBackground(backgroundType) {
            // Remove previous selection
            document.querySelectorAll('.bg-option').forEach(option => {
                option.classList.remove('selected');
            });
            
            // Select new option
            event.target.classList.add('selected');
            
            const calendar = document.getElementById('calendar');
            
            switch(backgroundType) {
                case 'gradient0':
                    calendar.style.backgroundImage = 'url("img/DORFic.webp")';
                    break;
                case 'gradient1':
                    calendar.style.backgroundImage = 'url("img/field_lake.jpg")';
                    break;
                case 'gradient2':
                    calendar.style.backgroundImage = 'url("img/cyber-glacier.webp")';
                    break;
                case 'gradient3':
                    calendar.style.backgroundImage = 'url("img/vector-flourish.jpg")';
                    break;
                case 'gradient4':
                    calendar.style.backgroundImage = 'url("img/frutiger-eco.webp")';
                    break;
                case 'gradient5':
                    calendar.style.backgroundImage = 'url("img/dark-aurora.webp")';
                    break;
                default:
                    calendar.style.backgroundImage = 'url("img/field_lake.jpg")';
            }
        }

        function previousMonth() {
            currentDate.setMonth(currentDate.getMonth() - 1);
            selectedDay = null;
            renderCalendar();
        }

        function nextMonth() {
            currentDate.setMonth(currentDate.getMonth() + 1);
            selectedDay = null;
            renderCalendar();
        }

        async function exportToPDF() {
            try {
                // Verify loaded libraries
                if (typeof html2canvas === 'undefined') {
                    alert('Error: La librería html2canvas no está disponible.');
                    return;
                }
                
                if (typeof window.jspdf === 'undefined') {
                    alert('Error: La librería jsPDF no está disponible.');
                    return;
                }
                
                // Obtain button in safe way
                const exportButton = document.querySelector('.export-btn');
                const originalText = exportButton.textContent;
                
                // Show load message
                exportButton.textContent = 'Generando PDF...';
                exportButton.disabled = true;
                
                const calendarElement = document.querySelector('.export-area');
                
                const canvas = await html2canvas(calendarElement, {
                    scale: 1.5,  // Reduced for better performance
                    useCORS: true,
                    allowTaint: true,
                    backgroundColor: '#ffffff',
                    width: calendarElement.offsetWidth,
                    height: calendarElement.offsetHeight,
                    scrollX: 0,
                    scrollY: 0
                });
                
                // Use window.jspdf.jsPDF
                const pdf = new window.jspdf.jsPDF('landscape', 'mm', 'a4');
                
                // Page's dimentions A4 horizontal: 297mm x 210mm
                const pageWidth = 297;
                const pageHeight = 210;
                
                // Calculate dimentions keeping proportions
                const canvasRatio = canvas.width / canvas.height;
                const pageRatio = pageWidth / pageHeight;
                
                let imgWidth, imgHeight, xPosition, yPosition;
                
                if (canvasRatio > pageRatio) {
                    // Wider canvas, adjust by width
                    imgWidth = pageWidth - 20; // 10mm margin on each side
                    imgHeight = imgWidth / canvasRatio;
                    xPosition = 10;
                    yPosition = (pageHeight - imgHeight) / 2;
                } else {
                    // Higher canvas, adjust by height
                    imgHeight = pageHeight - 20; // 10mm margin top and bottom
                    imgWidth = imgHeight * canvasRatio;
                    xPosition = (pageWidth - imgWidth) / 2;
                    yPosition = 10;
                }
                
                const imgData = canvas.toDataURL('image/png', 0.95);
                pdf.addImage(imgData, 'PNG', xPosition, yPosition, imgWidth, imgHeight);
                
                const fileName = `Calendario_${monthNames[currentDate.getMonth()]}_${currentDate.getFullYear()}.pdf`;
                pdf.save(fileName);
                
                // Restore button
                exportButton.textContent = originalText;
                exportButton.disabled = false;
                
            } catch (error) {
                console.error('Error al exportar PDF:', error);
                alert(`Hubo un error al exportar el PDF: ${error.message}`);
                
                // Restore button in case of error
                const exportButton = document.querySelector('.export-btn');
                if (exportButton) {
                    exportButton.textContent = 'Exportar como PDF';
                    exportButton.disabled = false;
                }
            }
        }

        // Restart calendar
        renderCalendar();
    </script>

    <script type="module" src="https://unpkg.com/ionicons@5.5.2/dist/ionicons/ionicons.esm.js"></script>

    <script>
    let isDragging = false;
    let dragStartPos = { x: 0, y: 0 };
    let dragStartTime = 0;
    let dragThreshold = 8; // pixels to considerate drag
    let clickTimeThreshold = 300; // ms max to click
    let initialElementPos = { x: 0, y: 0 };

    let toggle = document.querySelector('.toggle');
    let menu = document.querySelector('.menu');

    toggle.onmousedown = function(e) {
      e.preventDefault();
      e.stopPropagation(); // Important: avoid propagation
  
    // Save initial data
    dragStartPos.x = e.pageX;
    dragStartPos.y = e.pageY;
    dragStartTime = Date.now();
    isDragging = false;
  
    // Prepare to possible entire menu's drag
    menu.style.position = "absolute";
    initialElementPos.x = parseInt(menu.style.left) || 0;
    initialElementPos.y = parseInt(menu.style.top) || 0;
    };

    document.onmouseup = function(e) {
      if (dragStartTime > 0) {
        const clickDuration = Date.now() - dragStartTime;
        
        if (isDragging) {
          // DRAG = active - no toggle
          console.log("Menu arrastrado");
        } else if (clickDuration < clickTimeThreshold) {
          // CLICK = active - do toggle
          menu.classList.toggle('active');
        }
        
        // Reset variables
        isDragging = false;
        dragStartTime = 0;
      }
      
      drag = null;
    }

      document.onmousemove = function(e) {
        // Detect drag from toggle
        if (dragStartTime > 0) {
          const deltaX = e.pageX - dragStartPos.x;
          const deltaY = e.pageY - dragStartPos.y;
          const distance = Math.sqrt(deltaX * deltaX + deltaY * deltaY);
          
          // Detect if is drag
          if (distance > dragThreshold && !isDragging) {
            isDragging = true;
            drag = menu; // Asign entire menu to drag
          }
        }
          
      if (drag) {
        var x = e.pageX;
        var y = e.pageY;
        
        drag.style.left = x - 100 + "px";
        drag.style.top = y - 100 + "px";
      }
    }
    </script>
